<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="다락">
<meta name="theme-color" content="#6A1022">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="../icons/icon-180.png">
<link rel="icon" href="../icons/icon-32.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">
<title>다락</title>
<script src="https://accounts.google.com/gsi/client" async></script>
<style>
:root{--bg:#14100F;--panel:#1B1413;--card:#261C1B;--ink:#F3ECE4;--sub:#C4B8AE;--line:#3A2C2B;--bur:#6A1022;--gold:#E4C47E;--gold-ink:#2A0A12;--onbur:#EBD3B5;--thumb:#4A3A37;--dot:#E4C47E;--wm:#E4C47E}
@media (prefers-color-scheme: light){:root:not([data-theme=dark]){--bg:#F6F1EE;--panel:#EFE6E2;--card:#FFFFFF;--ink:#1A1012;--sub:#5C4A47;--line:#E3D3CF;--thumb:#E8D9D4;--dot:#A87A22;--wm:#8A2A3A}}
:root[data-theme=light]{--bg:#F6F1EE;--panel:#EFE6E2;--card:#FFFFFF;--ink:#1A1012;--sub:#5C4A47;--line:#E3D3CF;--thumb:#E8D9D4;--dot:#A87A22;--wm:#8A2A3A}
.relog{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 20px);transform:translateX(-50%);background:var(--gold);color:var(--gold-ink);height:46px;padding:0 20px;border-radius:23px;font-size:15px;font-weight:700;z-index:5;box-shadow:0 4px 16px rgba(0,0,0,.3)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:var(--app-h,100%);background:var(--bg);color:var(--ink);font-family:Pretendard,-apple-system,"Apple SD Gothic Neo",sans-serif;font-size:16px;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
a{color:inherit;text-decoration:none}
.app{display:flex;flex-direction:column;height:100%}
.head{background:var(--bur);color:#F3ECE4;padding:calc(env(safe-area-inset-top) + 14px) 18px 0}
.head .row{display:flex;align-items:center;gap:8px;min-height:48px}
.head h1{margin:0;font-size:30px;font-weight:800;flex:1;letter-spacing:-.8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.head .meta{color:var(--onbur);font-size:14px;padding:2px 0 16px}
.ib{width:44px;height:44px;border-radius:22px;border:1px solid rgba(243,236,228,.35);display:flex;align-items:center;justify-content:center;flex:none}
.ib svg{width:20px;height:20px;stroke:#F3ECE4;fill:none;stroke-width:1.8}
.back{border:0;margin-left:-10px}
.pill{height:36px;padding:0 14px;border-radius:18px;border:1px solid rgba(243,236,228,.35);font-size:14px;font-weight:500;color:#F3ECE4;flex:none}
.main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(env(safe-area-inset-bottom) + 24px)}
.sec{display:flex;align-items:center;justify-content:space-between;padding:18px 18px 10px}
.sec h2{margin:0;font-size:19px;font-weight:700;letter-spacing:-.3px}
.badge{min-width:26px;height:24px;padding:0 8px;border-radius:12px;background:var(--gold);color:var(--gold-ink);font-size:13px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.strip{display:flex;gap:12px;overflow-x:auto;padding:0 18px 4px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.vcard{width:200px;flex:none;display:flex;flex-direction:column;gap:7px;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.thumb{aspect-ratio:16/9;border-radius:12px;background:var(--thumb) center/cover no-repeat;position:relative}
.vt{font-size:15px;font-weight:600;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vs{font-size:14px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.notice{margin:14px 18px 4px;height:50px;padding:0 14px 0 16px;border:1px solid var(--line);border-radius:12px;display:flex;align-items:center;gap:10px;font-size:15px;background:var(--card)}
.notice b{margin-left:auto}
.item{display:flex;align-items:center;gap:14px;padding:0 18px;min-height:66px;width:100%;text-align:left;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.off .av,.off .name{opacity:.45}
.item .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;border-bottom:1px solid var(--line);min-height:66px;justify-content:center}
.item:last-child .body{border-bottom:0}
.name{font-size:16px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.new .name{font-weight:700}
.av{width:44px;height:44px;border-radius:22px;background:var(--thumb) center/cover;flex:none}
.gav{width:44px;height:44px;border-radius:12px;background:var(--bur);color:var(--gold);font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.dot{width:9px;height:9px;border-radius:5px;background:var(--dot);flex:none}
.chk{width:24px;height:24px;border-radius:12px;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center}
.on .chk{background:var(--gold);border-color:var(--gold)}
.chk svg{width:14px;height:14px;stroke:var(--gold-ink);stroke-width:3;fill:none;display:none}
.on .chk svg{display:block}
.mv{display:flex;gap:2px;flex:none}
.mv button{width:40px;height:40px;border-radius:20px;display:flex;align-items:center;justify-content:center}
.mv svg{width:18px;height:18px;stroke:var(--sub);fill:none;stroke-width:2}
.add{margin:8px 18px;height:48px;width:calc(100% - 36px);border:1px dashed var(--line);border-radius:12px;color:var(--sub);font-size:15px}
.sheet{position:sticky;bottom:0;background:var(--card);border-top:1px solid var(--line);border-radius:20px 20px 0 0;padding:18px 18px calc(env(safe-area-inset-bottom) + 18px)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 14px;max-height:30vh;overflow-y:auto}
.chip{height:40px;padding:0 14px;border-radius:20px;border:1px solid var(--line);font-size:15px;font-weight:500}
.chip.on{background:var(--gold);border-color:var(--gold);color:var(--gold-ink);font-weight:700}
.btns{display:flex;gap:10px}
.btn{flex:1;height:52px;border-radius:14px;font-size:16px;font-weight:700}
.btn.p{background:var(--gold);color:var(--gold-ink)}
.btn.s{border:1px solid var(--line);font-weight:500}
.btn:disabled{opacity:.4}
.seg{display:flex;gap:8px;padding:14px 18px 6px;flex-wrap:wrap}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:32px;text-align:center}
.center .btn{flex:none;width:100%;max-width:320px}
.logo{width:72px;height:72px;border-radius:18px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-size:15px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
.has-relog .toast,.has-tb .toast{bottom:calc(env(safe-area-inset-bottom) + 84px)}
.has-tb.has-relog .toast{bottom:calc(env(safe-area-inset-bottom) + 140px)}
.has-tb .relog{bottom:calc(env(safe-area-inset-bottom) + 80px)}
.toast button{margin-left:14px;font-weight:700;text-decoration:underline}
.dlg{position:fixed;top:0;left:0;right:0;height:var(--app-h,100%);background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.dlg .box{background:var(--card);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:20px 18px calc(env(safe-area-inset-bottom) + 18px);display:flex;flex-direction:column;gap:10px}
.dlg.top{align-items:flex-start}
.dlg.top .box{border-radius:0 0 20px 20px;padding:calc(env(safe-area-inset-top) + 20px) 18px 18px}
.dlg input{height:50px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;padding:0 14px;font-size:16px}
.opt{height:52px;border-radius:12px;text-align:left;padding:0 14px;font-size:16px}
.opt.sel{background:var(--bur);color:#F3ECE4;font-weight:700}
.danger{color:#E88A9A}
.tg{display:inline-flex;align-items:center;justify-content:center;height:34px;min-width:60px;padding:0 12px;border-radius:17px;border:1px solid var(--line);font-size:14px;font-weight:600;color:var(--sub);flex:none}
.tg.keep{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.tg.un{color:var(--sub);border-color:var(--line)}
.off .tg{opacity:1}
.chg .name::after{content:' •';color:var(--gold)}
.rv .main>*{max-width:760px}
.rv .head>*{max-width:724px}
.wsub{display:flex;height:100%}
.wsub>.app{flex:1;min-width:0}
.wsub .head{padding-top:calc(env(safe-area-inset-top) + 24px)}
.tabs{display:flex;gap:20px;flex:1;min-width:0}
.tabs button{padding:0 0 4px;border-bottom:2px solid transparent;font-size:26px;font-weight:700;letter-spacing:-.4px;color:var(--onbur);opacity:.55;white-space:nowrap}
.tabs .on{color:#F3ECE4;opacity:1;border-bottom-color:var(--gold)}
.rtabs{display:flex;gap:18px;margin:0 10px 18px}
.rtabs button{font-size:20px;font-weight:700;color:var(--onbur);opacity:.6;padding:0 0 6px;border-bottom:2px solid transparent}
.rtabs .on{opacity:1;color:#F3ECE4;border-bottom-color:var(--gold)}
.pthumb{width:96px;height:54px;border-radius:8px;background:var(--thumb) center/cover;flex:none}
button.sec{width:100%;text-align:left}
.sec .pill.sm{height:30px;padding:0 12px;font-size:13px;border-color:var(--line);color:var(--sub)}
.thumb .nd{position:absolute;top:8px;right:8px;width:11px;height:11px;border-radius:6px;background:var(--gold);box-shadow:0 0 0 2px rgba(0,0,0,.35)}
.pthumb{position:relative}
.pthumb .nd{position:absolute;top:5px;right:5px;width:9px;height:9px;border-radius:5px;background:var(--gold);box-shadow:0 0 0 2px rgba(0,0,0,.35)}
.seen .pthumb,.seen .thumb{opacity:.55}
.pin{display:inline-block;width:14px;height:14px;margin-right:4px;vertical-align:-1px;fill:var(--gold)}
.srch{flex:1;min-width:0;height:44px;border-radius:12px;border:0;background:rgba(255,255,255,.14);color:#F3ECE4;font:inherit;font-size:16px;padding:0 14px;outline:none}
.srch::placeholder{color:var(--onbur)}
.ichk{width:24px;height:24px;border-radius:12px;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center}
.ichk svg{width:14px;height:14px;stroke:var(--gold-ink);stroke-width:3;fill:none;display:none}
.on .ichk{background:var(--gold);border-color:var(--gold)}.on .ichk svg{display:block}
.fl{font-size:13px;color:var(--sub);margin:6px 0 -4px}
.gtags{display:inline-flex;gap:4px;margin-left:8px;vertical-align:1px}
.gtags i{font-style:normal;font-size:12px;font-weight:600;color:var(--dot);border:1px solid color-mix(in srgb,var(--gold) 55%,transparent);border-radius:6px;padding:0 6px;line-height:18px}
.gtags i.none{color:var(--sub);border-color:var(--line)}
.deck{display:flex;flex-direction:column;height:100%}
.cols{flex:1;display:flex;gap:12px;overflow-x:auto;padding:16px 16px calc(env(safe-area-inset-bottom) + 16px);scroll-snap-type:x proximity}
.dcol{flex:none;width:330px;display:flex;flex-direction:column;background:var(--panel);border-radius:14px;overflow:hidden;scroll-snap-align:start}
.dh{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 16px;min-height:52px;font-size:16px;font-weight:700;border-bottom:1px solid var(--line);text-align:left}
.dl{flex:1;overflow-y:auto}
.drow{display:flex;gap:10px;padding:10px 12px;width:100%;text-align:left;-webkit-touch-callout:none;user-select:none}
.drow .thumb{width:120px;flex:none;border-radius:8px}
.drow .vt{font-size:14px}.drow .vs{font-size:13px}
.divi{display:flex;align-items:center;gap:12px;color:var(--sub);font-size:14px;font-weight:600;padding:14px 12px 6px}
.divi::after{content:'';flex:1;height:1px;background:var(--line)}
.tabbar{display:flex;border-top:1px solid var(--line);background:var(--panel);padding:6px 0 calc(env(safe-area-inset-bottom) + 4px);flex:none}
.tb{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:500;color:var(--sub);padding:4px 0}
.tb svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linejoin:round;stroke-linecap:round}
.tb.on{color:var(--dot)}
.app.tbar .main{padding-bottom:16px}
.logo-s{width:30px;height:30px;border-radius:8px;flex:none}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;padding:0 18px}
.tile{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:52px;padding:0 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:15px;font-weight:500;text-align:left}
.tile span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcards{display:flex;gap:10px;overflow-x:auto;padding:0 18px 4px;scrollbar-width:none}
.pcards::-webkit-scrollbar{display:none}
.pcard{width:150px;flex:none;display:flex;flex-direction:column;gap:6px;text-align:left}
.pcard .thumb{border-radius:10px}
.more-link{color:var(--dot);font-size:14px;font-weight:600}
.hint{color:var(--sub);font-size:13px;padding:0 18px 6px}
.dlg .dtop{display:flex;align-items:center;justify-content:space-between;padding:0 4px 6px}
.dlg .dtop .x{color:var(--sub);font-size:15px;padding:6px 0 6px 12px}
.dlg .grab{width:40px;height:4px;border-radius:2px;background:var(--line);align-self:center;margin:-6px 0 6px}
.rnav{display:flex;flex-direction:column;gap:2px}
.rn{height:46px;display:flex;align-items:center;gap:12px;padding:0 12px;border-radius:10px;font-size:15px;font-weight:500;color:var(--onbur);width:100%;text-align:left}
.rn svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.rn.on{background:rgba(255,255,255,.13);color:#F3ECE4}
.rdiv{height:1px;background:rgba(255,255,255,.16);margin:10px 8px 12px}
.rlabel{font-size:12px;color:var(--onbur);opacity:.75;padding:0 12px 6px}
.secR{display:flex;align-items:baseline;gap:10px;margin:22px 18px 14px;padding-bottom:10px;border-bottom:1px solid color-mix(in srgb,var(--gold) 55%,transparent)}
.secR h2{margin:0;font-size:22px;font-weight:800;letter-spacing:-.5px}
.secR .cnt{color:var(--dot);font-size:15px;font-weight:700;flex:1}
.herobox{display:grid;grid-template-columns:minmax(0,1fr);gap:4px;padding:0 18px}
.herobox .side .item{padding:0}
.hero{display:flex;flex-direction:column;gap:8px;text-align:left;margin-bottom:6px;-webkit-touch-callout:none;user-select:none}
.hero .thumb{border-radius:12px}
.hero .tag{position:absolute;top:10px;left:10px;background:var(--gold);color:var(--gold-ink);font-size:12px;font-weight:700;border-radius:5px;padding:2px 8px}
.hero .ht{font-size:19px;font-weight:700;line-height:1.35;letter-spacing:-.3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hm{display:flex;align-items:center;gap:7px;color:var(--sub);font-size:13px}
.hm i{width:20px;height:20px;border-radius:10px;background:var(--thumb) center/cover;flex:none}
.gcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;padding:0 18px}
.gcard{display:flex;flex-direction:column;gap:12px;padding:13px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);text-align:left}
.gcard.hot{box-shadow:inset 0 2px 0 var(--gold)}
.gtop{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%}
.gtop b{font-size:16px;font-weight:700;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gnew{color:var(--dot);font-size:13px;font-weight:700;flex:none}
.gcnt{color:var(--sub);font-size:13px;flex:none}
.faces{display:flex;min-height:26px}
.faces i{width:26px;height:26px;border-radius:13px;background:var(--thumb) center/cover;border:2px solid var(--card);margin-left:-7px;flex:none}
.faces i:first-child{margin-left:0}
.faces i.on{border-color:var(--gold)}
.pcard{width:170px}
@media (min-width:900px){
  .feed>*{max-width:1680px}
  .feed .bar h2{font-size:34px!important;font-weight:800;letter-spacing:-1px}
  .feed .secR{margin-left:0;margin-right:0}
  .feed .sec{padding-left:0;padding-right:0}
  .feed .herobox,.feed .gcards,.feed .pcards{padding-left:0;padding-right:0}
  .feed .notice{margin-left:0;margin-right:0;width:100%!important}
  .herobox{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:28px}
  .hero .ht{font-size:22px}
  .gcards{grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
  .gcard{padding:18px 20px;gap:16px}
  .gtop b{font-size:18px}
  .faces{min-height:38px}
  .faces i{width:38px;height:38px;border-radius:19px;margin-left:-9px}
  .pcard{width:240px}
}
.brand{display:flex;align-items:center;gap:12px;padding:36px 18px 22px;color:var(--sub);font-size:12px}
.brand img{width:40px;height:40px;border-radius:50%;box-shadow:0 0 0 1px color-mix(in srgb,var(--gold) 60%,transparent)}
.brand span{display:flex;flex-direction:column;gap:2px}
@font-face{font-family:'HouseYJ';src:url('../fonts/brand-house.woff2') format('woff2');font-display:block}
.bm{font-family:'HouseYJ',serif;font-weight:600;letter-spacing:.08em}   /* House of YJ 글씨 (Cormorant SC, 작은 대문자) */
.brand b{color:var(--dot);font-size:17px}
.logo-s.seal{border-radius:0}
.rbrand{display:flex;align-items:center;gap:12px;padding:0 10px 22px}
.rbrand img{width:44px;height:44px}   /* 버건디 바탕 위: 골드 테두리 + 골드 YJ 로고 */
.rbrand span{color:var(--gold);font-size:19px}
@font-face{font-family:'DarakA';src:url('../fonts/darak-A.woff2') format('woff2');font-display:block}
@font-face{font-family:'DarakB';src:url('../fonts/darak-B.woff2') format('woff2');font-display:block}
@font-face{font-family:'DarakC';src:url('../fonts/darak-C.woff2') format('woff2');font-display:block}
@font-face{font-family:'DarakD';src:url('../fonts/darak-D.woff2') format('woff2');font-display:block}
@font-face{font-family:'DarakE';src:url('../fonts/darak-E.woff2') format('woff2');font-display:block}
@font-face{font-family:'DarakF';src:url('../fonts/darak-F.woff2') format('woff2');font-display:block}
.wm{font-family:var(--wmf,'DarakA'),serif!important;font-weight:400!important;letter-spacing:.04em!important;-webkit-text-stroke:var(--wms,.03em) currentColor}
.wopt{display:flex;align-items:center;gap:16px;height:64px}
.wopt .wm{font-size:30px;width:96px;flex:none}
.wopt span:last-child{font-size:14px}
.feed .bar h2.wm{font-size:54px!important;color:var(--wm)}
.brand em.wm{color:var(--wm);font-size:18px}
.brand em{font-style:normal;font-size:15px}
/* 태블릿 */
.wide{display:none}
@media (min-width:900px){
  .narrow{display:none!important}
  .wide{display:flex;height:100%}
  .rail{width:264px;flex:none;background:var(--bur);color:#F3ECE4;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 28px) 12px 20px;gap:4px;overflow-y:auto}
  .rail h1{margin:0 10px 18px;font-size:22px}
  .rg{height:46px;padding:0 12px;border-radius:10px;display:flex;align-items:center;gap:10px;font-size:15px;color:var(--onbur);width:100%;text-align:left}
  .rg span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

}
function moreWide() {
  return `<div class="wide"><div class="rail">${railNav()}</div><div class="feed"><div class="bar"><h2 style="margin:0;font-size:28px;flex:1">관리</h2><span class="vs">구독 ${subs.length}개 · 그룹 ${data.groups.length}개 · 재생목록 ${pls.length}개</span></div><div style="max-width:640px;margin:0 -18px">${moreBody()}</div></div></div>`;
}
function wide() {
  if (view.name === 'home') return homeWide();
  if (view.name === 'more') return moreWide();
  if (view.name === 'pl' || view.name === 'plv') return plWide();
  const gs = sortGroups(data.groups);
  const un = unsorted();
  if (!view.wg) view.wg = gs[0]?.id || (un.length ? 'un' : null);
  const g = data.groups.find(x => x.id === view.wg);
  const list = view.wg === 'un' ? un : g ? sortChannels(chOf(g), g) : [];
  const title = view.wg === 'un' ? '그룹 없음' : g ? g.name : '';
  const wc = list.find(s => s.id === view.wc);
  return `<div class="wide">
    <div class="rail">${railNav()}<div class="rlabel">그룹</div>
      ${un.length ? `<button class="rg un ${view.wg === 'un' ? 'sel' : ''}" data-wg="un"><span>그룹 없음</span><i>${un.length}</i></button>` : ''}
      ${gs.map(x => { const n = newCount(chOf(x)); return `<button class="rg ${x.id === view.wg ? 'sel' : ''}" data-wg="${x.id}"><span>${esc(x.name)}</span>${n ? `<i>${n}</i>` : ''}</button>`; }).join('')}
      <button class="rg" data-act="newgroup" style="opacity:.8">+ 새 그룹</button>
      <span style="flex:1"></span><button class="rg" data-act="search">검색</button><button class="rg" data-act="deck">나란히 보기</button>
    </div>
    <div class="col"><div class="top"><h2>${esc(title)}</h2><div class="vs" style="margin-top:4px">채널 ${list.length}개</div></div>
      <div class="list">${list.map(s => chRow(s, view.wc === s.id ? 'aria-current="true"' : '', false, true)).join('')}</div></div>
    <div class="feed"><div class="bar">
      ${wc ? `<button class="pill p" data-act="wcclear">${esc(wc.title)} · 전체 채널 보기</button>` : ''}${g ? `<button class="pill" data-act="csort">채널: ${label(chSorts, data.sort.channels)}</button><button class="pill" data-act="gmenu">그룹 설정</button>` : ''}${newCount(list) ? '<button class="pill" data-act="allseen">모두 봤음</button>' : ''}
      <span style="flex:1"></span><button class="pill" data-act="gsort">그룹: ${label(groupSorts, data.sort.groups)}</button>
      <button class="pill p" data-act="organize-w">채널 분류</button></div>
      <div class="grid">${wc ? (feedOf([wc]).map(vCard).join('') || '<div class="vs">불러온 영상이 없습니다</div>') : weekFeed(list, vCard, '', '')}</div></div>
  </div>`;
}

/* ---------- 그리기 ---------- */
// 화면을 다시 그려도 스크롤 자리를 지킴 (같은 화면일 때만; 왼쪽 레일은 항상)
const SCR = ['.rail', '.main', '.list', '.feed', '.strip', '.chips', '.cols', '.dl'];
let lastKey = '';
function render() {
  if (view.name === 'loading') { lastKey = ''; $app.innerHTML = center('<span class="vs">불러오는 중</span>'); return; }
  if (view.name === 'auth') { lastKey = ''; $app.innerHTML = center('<button class="btn p" data-act="login">계속</button>'); return; }
  if (!data) return;
  applyWm();
  norm(data);
  const narrow = { home, subs: subsView, feedall, more, group: groupView, organize, reorder, review, pl: plView, plv: plvView, search, deck }[view.name]?.() || home();
  const showWide = ['home', 'subs', 'more', 'group', 'pl', 'plv'].includes(view.name);
  const tb = TOP.includes(view.name) || view.name === 'feedall';
  const html = (showWide ? `<div class="narrow app ${tb ? 'tbar' : ''}">${narrow}${tb ? tabbar() : ''}</div>${wide()}` : (isWide() && view.name !== 'deck' ? `<div class="wsub"><div class="rail" style="width:264px;flex:none;background:var(--bur);display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 28px) 12px 20px">${railNav()}</div><div class="app rv">${narrow}</div></div>` : `<div class="app ${['review', 'search'].includes(view.name) ? 'rv' : ''} ${tb ? 'tbar' : ''}">${narrow}${tb ? tabbar() : ''}</div>`)) + (authNeeded ? '<button class="relog" data-act="login">다시 로그인</button>' : '');
  document.body.classList.toggle('has-relog', authNeeded);
  document.body.classList.toggle('has-tb', tb && !isWide());
  const key = [view.name, view.id, view.wg, view.ps, view.filter, view.gid, load('gtab', 'ch')].join('|');
  const pos = SCR.map((q, i) => i && key !== lastKey ? [] : [...$app.querySelectorAll(q)].map(e => [e.scrollTop, e.scrollLeft]));
  $app.innerHTML = html;
  SCR.forEach((q, i) => [...$app.querySelectorAll(q)].forEach((e, k) => { const p = pos[i][k]; if (p && (p[0] || p[1])) { e.scrollTop = p[0]; e.scrollLeft = p[1]; } }));
  lastKey = key;
}

/* ---------- 입력 ---------- */
let press = null, pressed = false;
const lpT = e => e.target.closest('[data-ch],[data-pl],[data-vid],[data-mv]');
const lpRun = t => t.dataset.mv ? itemMenu(t.dataset.pid, t.dataset.mv, t.dataset.pi) : t.dataset.ch ? chMenu(t.dataset.ch) : t.dataset.pl ? plMenu(t.dataset.pl) : vidMenu(t.dataset.v, t.dataset.vid);
$app.addEventListener('pointerdown', e => { const t = lpT(e); pressed = false; if (!t) return; press = setTimeout(() => { pressed = true; lpRun(t); }, 500); });
['pointerup', 'pointercancel', 'pointermove'].forEach(k => $app.addEventListener(k, e => { if (k !== 'pointermove' || Math.abs(e.movementX) + Math.abs(e.movementY) > 4) clearTimeout(press); }));
$app.addEventListener('contextmenu', e => { const t = lpT(e); if (t) { e.preventDefault(); clearTimeout(press); if (!pressed) { pressed = true; lpRun(t); } } });
$app.addEventListener('input', e => { if (e.target.id === 'q') { view.q = e.target.value; document.getElementById('sr').innerHTML = searchRes(view.q); } });
$app.addEventListener('click', e => {
  if (pressed) { pressed = false; return; }
  const op = e.target.closest('[data-open]'); if (op) return openChannel(op.dataset.open);
  const t = e.target.closest('button,[data-ch],[data-ts]'); if (!t) return;
  const d = t.dataset;
  if (d.ch && t.closest('.wide .col')) { view.wc = view.wc === d.ch ? null : d.ch; return render(); }   // PC 그룹 화면: 누르면 오른쪽에 그 채널 영상만
  if (d.ch) return openChannel(d.ch);
  if (d.mv) return playTrack(d.pid, d.mv);
  if (d.ts) { tsel.has(d.ts) ? tsel.delete(d.ts) : tsel.add(d.ts); return render(); }
  if (d.gt) { keep('gtab', d.gt); return render(); }
  if (d.tu || d.td) { const i = +(d.tu ?? d.td); return moveTrack(view.id, i, d.tu ? i - 1 : i + 1); }
  if (d.tx) { const it = plItems[view.id].items[+d.tx]; return choose(it.title, [['rm', '이 재생목록에서 빼기', 'danger']], '', () => removeTrack(view.id, it.pi)); }
  if (d.pl) return showPl(d.pl);
  if (d.plg) return plGroupMenu(d.plg);
  if (d.ps) { view.ps = d.ps; if (view.name === 'plv') view.name = 'pl'; return render(); }
  if (d.v) return openVideo(d.v, d.vid);
  if (d.g) return go({ name: 'group', id: d.g });
  if (d.wg) { view.wg = d.wg; view.id = d.wg; view.wc = null; return render(); }
  if (d.rs) return toggleSub(d.rs, true);
  if (d.sel) { sel.has(d.sel) ? sel.delete(d.sel) : sel.add(d.sel); return render(); }
  if (d.pick) { pick.has(d.pick) ? pick.delete(d.pick) : pick.add(d.pick); return render(); }
  if (d.f) { view.filter = d.f; sel.clear(); return render(); }
  if (d.up || d.dn) { const i = +(d.up ?? d.dn), j = d.up ? i - 1 : i + 1; [data.groups[i], data.groups[j]] = [data.groups[j], data.groups[i]]; data.sort.groups = 'manual'; save(); return render(); }
  const cur = () => data.groups.find(x => x.id === (view.name === 'group' ? view.id : view.wg));
  switch (d.act) {
    case 'login': login(); break;
    case 'home': go({ name: 'home' }); break;
    case 'back': back(); break;
    case 'subs': go({ name: 'subs', wg: view.wg }); break;
    case 'more': go({ name: 'more' }); break;
    case 'feedall': go({ name: 'feedall', from: view.name }); break;
    case 'backg': go({ name: 'group', id: view.gid }); break;
    case 'gsort': choose('그룹 정렬', groupSorts, data.sort.groups, v => { data.sort.groups = v; save(); render(); }); break;
    case 'psort': choose('재생목록 정렬', plSorts, plSortKey(), v => { data.sort.pls = v; save(); render(); }); break;
    case 'csort': choose('채널 정렬', chSorts, data.sort.channels, v => { data.sort.channels = v; save(); render(); }); break;
    case 'reorder': go({ name: 'reorder', from: view.name }); break;
    case 'tab-sub': go({ name: 'subs', wg: view.wg }); break;
    case 'theme': themeDlg(); break;
    case 'wmfont': wmDlg(); break;
    case 'wcclear': view.wc = null; render(); break;
    case 'pl': case 'tab-pl': go({ name: 'pl', ps: view.ps }); refreshPls(); break;
    case 'plback': go({ name: 'pl', ps: view.ps }); break;
    case 'pledit': view.edit = !view.edit; tsel.clear(); render(); break;
    case 'tselall': { const a = plItems[view.id]?.items || []; a.every(x => tsel.has(x.pi)) ? tsel.clear() : a.forEach(x => tsel.add(x.pi)); render(); break; }
    case 'bmove': pickTarget('어느 재생목록으로 옮길까요?', id => bulk('move', id)); break;
    case 'bcopy': pickTarget('어느 재생목록에 복사할까요?', id => bulk('copy', id)); break;
    case 'brm': choose(`${tsel.size}곡을 이 재생목록에서 뺄까요?`, [['y', '빼기', 'danger']], '', () => bulk('rm')); break;
    case 'pladdmenu': choose('추가', [['pl', '새 재생목록'], ['g', '새 재생목록 그룹']], '', v => v === 'pl' ? newPl() : ask('새 그룹', '', n => { data.pl.groups.push({ id: uid(), name: n, pl: [] }); save(); render(); })); break;
    case 'plnew': newPl(); break;
    case 'search': go({ name: 'search', q: '', from: view.name }); document.getElementById('q')?.focus(); break;   // 아이폰은 누른 순간에 바로 포커스해야 키보드가 뜸
    case 'deck': go({ name: 'deck', from: view.name }); break;
    case 'plplay': { const f = plItems[view.id]?.items[0]; if (f) playTrack(view.id, f.vid); break; }
    case 'plmenu': plMenu(view.id); break;
    case 'plnewgroup': ask('새 그룹', '', n => { data.pl.groups.push({ id: uid(), name: n, pl: [] }); save(); render(); }); break;
    case 'pladd': addDlg('', view.name === 'plv' ? view.id : null); break;
    case 'review': go({ name: 'review', from: view.name }); loadStats().catch(() => {}); break;
    case 'restore': restoreDlg(); break;
    case 'rvexit': { const gone = [...dropped].filter(id => !isSub(id)); if (gone.length) { data.groups.forEach(g => g.ch = g.ch.filter(c => !gone.includes(c))); save(); } dropped.clear(); back(); break; }
    case 'newgroup': case 'newgroup-pick': ask('새 그룹', '', v => { const g = { id: uid(), name: v, ch: [] }; data.groups.push(g); if (d.act === 'newgroup-pick') pick.add(g.id); save(); render(); }); break;
    case 'organize': go({ name: 'organize', from: view.name }); break;
    case 'organize-w': go({ name: 'organize', gid: view.wg !== 'un' ? view.wg : null, filter: view.wg === 'un' ? 'un' : null }); break;
    case 'organize-g': go({ name: 'organize', gid: view.id, filter: 'in' }); break;
    case 'selall': { const all = [...$app.querySelectorAll('[data-sel]')].map(b => b.dataset.sel); const every = all.every(x => sel.has(x)); all.forEach(x => every ? sel.delete(x) : sel.add(x)); render(); break; }
    case 'put': data.groups.forEach(g => { if (pick.has(g.id)) sel.forEach(c => { if (!g.ch.includes(c)) g.ch.push(c); }); }); save(); toast(`${sel.size}개를 넣었습니다`); sel.clear(); render(); break;
    case 'pull': { const from = pick.size ? pick : new Set([view.gid]); data.groups.forEach(g => { if (from.has(g.id)) g.ch = g.ch.filter(c => !sel.has(c)); }); save(); toast(`${sel.size}개를 뺐습니다`); sel.clear(); render(); break; }
    case 'allseenall': known().forEach(s => data.seen[s.id] = Date.now()); save(1); render(); break;
    case 'allseen': { const g = cur(); if (g) chOf(g).forEach(s => data.seen[s.id] = Date.now()); save(1); render(); break; }
    case 'gmenu': { const g = cur(); if (!g) break; choose(`그룹 설정 · ${g.name}`, [['rename', '이름 바꾸기'], ['org', '채널 분류'], ['del', '그룹 삭제', 'danger']], '', v => {
      if (v === 'org') go({ name: 'organize', gid: g.id, filter: 'in', from: view.name });
      if (v === 'rename') ask('그룹 이름', g.name, n => { g.name = n; save(); render(); });
      if (v === 'del') { const i = data.groups.indexOf(g); data.groups.splice(i, 1); save(); go({ name: 'subs' }); toast('그룹을 삭제했습니다', '되돌리기', () => { data.groups.splice(i, 0, g); save(); render(); }); }
    }); break; }
  }
});

start();
}
</script>
</body>
</html>
