<style>
:root{--bg:#14100F;--panel:#1B1413;--card:#261C1B;--ink:#F3ECE4;--sub:#C4B8AE;--line:#3A2C2B;--bur:#6A1022;--gold:#E4C47E;--gold-ink:#2A0A12;--onbur:#EBD3B5;--thumb:#4A3A37;--dot:#E4C47E}
@media (prefers-color-scheme: light){:root:not([data-theme=dark]){--bg:#FAF7F4;--panel:#F3ECE7;--card:#FFFFFF;--ink:#1E1416;--sub:#6B5E58;--line:#E6DCD5;--thumb:#E5D9D2;--dot:#C99A3A}}
:root[data-theme=light]{--bg:#FAF7F4;--panel:#F3ECE7;--card:#FFFFFF;--ink:#1E1416;--sub:#6B5E58;--line:#E6DCD5;--thumb:#E5D9D2;--dot:#C99A3A}
.relog{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 20px);transform:translateX(-50%);background:var(--gold);color:var(--gold-ink);height:46px;padding:0 20px;border-radius:23px;font-size:15px;font-weight:700;z-index:5;box-shadow:0 4px 16px rgba(0,0,0,.3)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Pretendard,-apple-system,"Apple SD Gothic Neo",sans-serif;font-size:16px;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
a{color:inherit;text-decoration:none}
.app{display:flex;flex-direction:column;height:100%}
.head{background:var(--bur);color:#F3ECE4;padding:calc(env(safe-area-inset-top) + 14px) 18px 0}
.head .row{display:flex;align-items:center;gap:8px;min-height:48px}
.head h1{margin:0;font-size:28px;font-weight:700;flex:1;letter-spacing:-.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.head .meta{color:var(--onbur);font-size:14px;padding:2px 0 16px}
.ib{width:44px;height:44px;border-radius:22px;border:1px solid rgba(243,236,228,.35);display:flex;align-items:center;justify-content:center;flex:none}
.ib svg{width:20px;height:20px;stroke:#F3ECE4;fill:none;stroke-width:1.8}
.back{border:0;margin-left:-10px}
.pill{height:36px;padding:0 14px;border-radius:18px;border:1px solid rgba(243,236,228,.35);font-size:14px;font-weight:500;color:#F3ECE4;flex:none}
.main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(env(safe-area-inset-bottom) + 24px)}
.sec{display:flex;align-items:center;justify-content:space-between;padding:18px 18px 10px}
.sec h2{margin:0;font-size:17px;font-weight:700}
.badge{min-width:26px;height:24px;padding:0 8px;border-radius:12px;background:var(--gold);color:var(--gold-ink);font-size:13px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.strip{display:flex;gap:12px;overflow-x:auto;padding:0 18px 4px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.vcard{width:200px;flex:none;display:flex;flex-direction:column;gap:7px;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.thumb{aspect-ratio:16/9;border-radius:12px;background:var(--thumb) center/cover no-repeat;position:relative}
.vt{font-size:15px;font-weight:500;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vs{font-size:14px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.notice{margin:14px 18px 4px;height:50px;padding:0 14px 0 16px;border:1px solid var(--line);border-radius:12px;display:flex;align-items:center;gap:10px;font-size:15px;background:var(--card)}
.notice b{margin-left:auto}
.item{display:flex;align-items:center;gap:14px;padding:0 18px;min-height:66px;width:100%;text-align:left;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.off .av,.off .name{opacity:.45}
.item .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;border-bottom:1px solid var(--line);min-height:66px;justify-content:center}
.item:last-child .body{border-bottom:0}
.name{font-size:16px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.new .name{font-weight:700}
.av{width:44px;height:44px;border-radius:22px;background:var(--thumb) center/cover;flex:none}
.gav{width:44px;height:44px;border-radius:12px;background:var(--bur);color:var(--gold);font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.dot{width:9px;height:9px;border-radius:5px;background:var(--dot);flex:none}
.chk{width:24px;height:24px;border-radius:12px;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center}
.on .chk{background:var(--gold);border-color:var(--gold)}
.chk svg{width:14px;height:14px;stroke:var(--gold-ink);stroke-width:3;fill:none;display:none}
.on .chk svg{display:block}
.mv{display:flex;gap:2px;flex:none}
.mv button{width:40px;height:40px;border-radius:20px;display:flex;align-items:center;justify-content:center}
.mv svg{width:18px;height:18px;stroke:var(--sub);fill:none;stroke-width:2}
.add{margin:8px 18px;height:48px;width:calc(100% - 36px);border:1px dashed var(--line);border-radius:12px;color:var(--sub);font-size:15px}
.sheet{position:sticky;bottom:0;background:var(--card);border-top:1px solid var(--line);border-radius:20px 20px 0 0;padding:18px 18px calc(env(safe-area-inset-bottom) + 18px)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 14px;max-height:30vh;overflow-y:auto}
.chip{height:40px;padding:0 14px;border-radius:20px;border:1px solid var(--line);font-size:15px;font-weight:500}
.chip.on{background:var(--bur);border-color:var(--gold);color:#F3ECE4;font-weight:700}
.btns{display:flex;gap:10px}
.btn{flex:1;height:52px;border-radius:14px;font-size:16px;font-weight:700}
.btn.p{background:var(--gold);color:var(--gold-ink)}
.btn.s{border:1px solid var(--line);font-weight:500}
.btn:disabled{opacity:.4}
.seg{display:flex;gap:8px;padding:14px 18px 6px;flex-wrap:wrap}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:32px;text-align:center}
.center .btn{flex:none;width:100%;max-width:320px}
.logo{width:72px;height:72px;border-radius:18px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-size:15px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.dlg .box{background:var(--card);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:20px 18px calc(env(safe-area-inset-bottom) + 18px);display:flex;flex-direction:column;gap:10px}
.dlg input{height:50px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;padding:0 14px;font-size:16px}
.opt{height:52px;border-radius:12px;text-align:left;padding:0 14px;font-size:16px}
.opt.sel{background:var(--bur);color:#F3ECE4;font-weight:700}
.danger{color:#E88A9A}
.tg{display:inline-flex;align-items:center;justify-content:center;height:34px;min-width:60px;padding:0 12px;border-radius:17px;border:1px solid var(--line);font-size:14px;font-weight:600;color:var(--sub);flex:none}
.tg.keep{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.tg.un{color:#E88A9A;border-color:rgba(232,138,154,.5)}
.off .tg{opacity:1}
.chg .name::after{content:' •';color:var(--gold)}
.rv .main{max-width:760px;width:100%;margin:0 auto}
.rv .head>*{max-width:724px;margin-left:auto;margin-right:auto}
.tabs{display:flex;gap:22px;margin-top:-6px}
.tabs button{padding:0 0 12px;border-bottom:2px solid transparent;font-size:16px;font-weight:500;color:var(--onbur)}
.tabs .on{color:#F3ECE4;font-weight:700;border-bottom-color:var(--gold)}
.rtabs{display:flex;gap:18px;margin:0 10px 18px}
.rtabs button{font-size:20px;font-weight:700;color:var(--onbur);opacity:.6;padding:0 0 6px;border-bottom:2px solid transparent}
.rtabs .on{opacity:1;color:#F3ECE4;border-bottom-color:var(--gold)}
.pthumb{width:96px;height:54px;border-radius:8px;background:var(--thumb) center/cover;flex:none}
button.sec{width:100%;text-align:left}
/* 태블릿 */
.wide{display:none}
@media (min-width:900px){
  .narrow{display:none!important}
  .wide{display:flex;height:100%}
  .rail{width:264px;flex:none;background:var(--bur);color:#F3ECE4;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 28px) 12px 20px;gap:4px;overflow-y:auto}
  .rail h1{margin:0 10px 18px;font-size:22px}
  .rg{height:46px;padding:0 12px;border-radius:10px;display:flex;align-items:center;gap:10px;font-size:15px;color:var(--onbur);width:100%;text-align:left}
  .rg span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rg.sel{background:var(--bg);color:var(--ink);font-weight:700}
  .rg.un{border:1px dashed var(--gold);margin-bottom:10px;color:#F3ECE4;font-weight:700}
  .rg i{font-style:normal;font-size:14px;font-weight:700;color:var(--gold)}
  .col{width:340px;flex:none;border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column}
  .col .top{padding:calc(env(safe-area-inset-top) + 28px) 22px 14px;border-bottom:1px solid var(--line)}
  .col .top h2{margin:0;font-size:28px}
  .col .list{flex:1;overflow-y:auto}
  .col .item.sel{background:var(--card)}
  .feed{flex:1;min-width:0;overflow-y:auto;padding:calc(env(safe-area-inset-top) + 24px) 32px 32px}
  .bar{display:flex;gap:10px;align-items:center;margin-bottom:20px}
  .bar .pill{border-color:var(--line);color:var(--ink)}
  .bar .pill.p{background:var(--gold);border-color:var(--gold);color:var(--gold-ink);font-weight:700}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:24px 18px}
  .grid .vcard{width:auto}
}
</style>

<body>
<div class="app" id="app"></div>
<div class="toast" id="toast"></div>
<script>
{
const CLIENT_ID = '123904132689-al5msm3lu9itk3hp3q0dap43vka6ejr8.apps.googleusercontent.com';
const SCOPES = 'https://www.googleapis.com/auth/youtube https://www.googleapis.com/auth/drive.appdata';
const FILE = 'groups.json';
const LS = k => 'yg.' + k;
const $app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const load = (k, d) => { try { return JSON.parse(localStorage.getItem(LS(k))) ?? d; } catch { return d; } };
const keep = (k, v) => { try { localStorage.setItem(LS(k), JSON.stringify(v)); } catch {} };
const uid = () => Math.random().toString(36).slice(2, 10);
const setTheme = t => { if (t === 'auto') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = t; };
setTheme(load('theme', 'auto'));
const ic = {
  back: '<svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>',
  sort: '<svg viewBox="0 0 24 24"><path d="M4 7h16M7 12h10M10 17h4"/></svg>',
  more: '<svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></svg>',
  up: '<svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg>',
  down: '<svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>',
  chk: '<svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg>'
};

let token = null, tokenExp = 0, client = null;
let subs = load('subs', []);
let extra = load('extra', {});
let stats = load('stats', {});
let pls = load('pls', []);
let plItems = {};
let latest = load('latest', {});
let data = load('data', null);
let fileId = load('fileId', null);
let view = { name: 'home' };
let sel = new Set(), pick = new Set();
let saving = null;

const ago = t => {
  if (!t) return '';
  const s = (Date.now() - t) / 1000;
  if (s < 3600) return Math.max(1, Math.floor(s / 60)) + '분 전';
  if (s < 86400) return Math.floor(s / 3600) + '시간 전';
  if (s < 172800) return '어제';
  if (s < 604800) return Math.floor(s / 86400) + '일 전';
  if (s < 2592000) return Math.floor(s / 604800) + '주 전';
  if (s < 31536000) return Math.floor(s / 2592000) + '개월 전';
  return Math.floor(s / 31536000) + '년 전';
};
const toast = m => { const t = document.getElementById('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('show'), 1800); };

const subIds = () => new Set(subs.map(s => s.id));
const subOf = id => subs.find(s => s.id === id) || (extra[id] && { ...extra[id], off: true });
const isNew = id => { const l = latest[id]; return !!(l && l.t > (data.seen[id] ?? data.since)); };
const grouped = () => { const s = new Set(); data.groups.forEach(g => g.ch.forEach(c => s.add(c))); return s; };
const unsorted = () => { const g = grouped(); return subs.filter(s => !g.has(s.id)); };
const chOf = g => g.ch.map(subOf).filter(Boolean);
const known = () => { const ids = subIds(); return subs.concat([...grouped()].filter(c => !ids.has(c) && extra[c]).map(subOf)); };
const newCount = list => list.filter(s => isNew(s.id)).length;

function sortGroups(list) {
  const m = data.sort.groups;
  const a = [...list];
  if (m === 'name') a.sort((x, y) => x.name.localeCompare(y.name, 'ko'));
  if (m === 'new') a.sort((x, y) => newCount(chOf(y)) - newCount(chOf(x)));
  if (m === 'recent') { const last = g => Math.max(0, ...g.ch.map(c => latest[c]?.t || 0)); a.sort((x, y) => last(y) - last(x)); }
  return a;
}
function sortChannels(list, g) {
  const m = data.sort.channels;
  const a = [...list];
  if (m === 'name') a.sort((x, y) => x.title.localeCompare(y.title, 'ko'));
  else if (m === 'recent') a.sort((x, y) => (latest[y.id]?.t || 0) - (latest[x.id]?.t || 0));
  else if (g) a.sort((x, y) => g.ch.indexOf(x.id) - g.ch.indexOf(y.id));
  return a;
}

/* ---------- 인증 ---------- */
function auth(prompt) {
  return new Promise((res, rej) => {
    if (!window.google?.accounts?.oauth2) return rej('gis');
    client = google.accounts.oauth2.initTokenClient({
      client_id: CLIENT_ID, scope: SCOPES,
      callback: r => { if (r.error) return rej(r.error); token = r.access_token; tokenExp = Date.now() + (r.expires_in - 60) * 1000; keep('tok', { token, tokenExp, scope: SCOPES }); res(); },
      error_callback: e => rej(e.type || 'err')
    });
    client.requestAccessToken({ prompt });
  });
}
// 토큰은 1시간짜리라, 끊기기 전에 화면 없이 조용히 다시 받아 옴
let refreshing = null, authNeeded = false;
const silent = () => refreshing ||= auth('').then(() => { authNeeded = false; keep('acct', 1); }).finally(() => { refreshing = null; });
async function api(url, opt = {}, retry = true) {
  if (!token || Date.now() > tokenExp) { try { await silent(); } catch { throw 'auth'; } }
  const r = await fetch(url, { ...opt, headers: { Authorization: 'Bearer ' + token, ...(opt.headers || {}) } });
  if (r.status === 401) { token = null; if (retry) return api(url, opt, false); throw 'auth'; }
  if (!r.ok) throw r.status;
  return r.status === 204 ? null : r.json();
}

/* ---------- 드라이브 ---------- */
async function driveLoad() {
  const q = encodeURIComponent(`name='${FILE}'`);
  const l = await api(`https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=${q}&fields=files(id)`);
  if (l.files.length) {
    fileId = l.files[0].id; keep('fileId', fileId);
    const r = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`, { headers: { Authorization: 'Bearer ' + token } });
    if (r.ok) return r.json();
  }
  return null;
}
async function driveSave() {
  data.updated = Date.now();
  keep('data', data);
  const body = JSON.stringify(data);
  if (fileId) {
    await api(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`, { method: 'PATCH', body, headers: { 'Content-Type': 'application/json' } });
  } else {
    const fd = new FormData();
    fd.append('metadata', new Blob([JSON.stringify({ name: FILE, parents: ['appDataFolder'] })], { type: 'application/json' }));
    fd.append('file', new Blob([body], { type: 'application/json' }));
    const r = await api('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', { method: 'POST', body: fd });
    fileId = r.id; keep('fileId', fileId);
  }
}
function save() {
  keep('data', data);
  clearTimeout(saving);
  saving = setTimeout(() => driveSave().catch(e => e === 'auth' ? needAuth() : toast('저장 실패')), 800);
}

/* ---------- YouTube ---------- */
async function loadSubs() {
  let out = [], page = '';
  do {
    const d = await api('https://www.googleapis.com/youtube/v3/subscriptions?part=snippet&mine=true&maxResults=50' + (page ? '&pageToken=' + page : ''));
    out = out.concat(d.items.map(i => ({ id: i.snippet.resourceId.channelId, sid: i.id, title: i.snippet.title, thumb: i.snippet.thumbnails?.default?.url || '' })));
    page = d.nextPageToken || '';
  } while (page);
  // 구독 목록의 채널 이름은 영어로 오는 경우가 있어 채널 원래 이름으로 바꿈
  for (let i = 0; i < out.length; i += 50) {
    const d = await api('https://www.googleapis.com/youtube/v3/channels?part=snippet&maxResults=50&id=' + out.slice(i, i + 50).map(x => x.id).join(','));
    (d.items || []).forEach(c => { const x = out.find(o => o.id === c.id); if (x) { x.title = c.snippet.title; x.thumb = c.snippet.thumbnails?.default?.url || x.thumb; } });
  }
  subs = out; keep('subs', subs);
}
async function loadExtra() {
  const ids = subIds();
  const need = [...grouped()].filter(c => !ids.has(c) && !extra[c]);
  for (let i = 0; i < need.length; i += 50) {
    const part = need.slice(i, i + 50);
    const d = await api('https://www.googleapis.com/youtube/v3/channels?part=snippet&maxResults=50&id=' + part.join(','));
    (d.items || []).forEach(c => extra[c.id] = { id: c.id, title: c.snippet.title, thumb: c.snippet.thumbnails?.default?.url || '' });
    keep('extra', extra);
  }
}
async function loadPls() {
  let out = [], page = '';
  do {
    const d = await api('https://www.googleapis.com/youtube/v3/playlists?part=snippet,contentDetails&mine=true&maxResults=50' + (page ? '&pageToken=' + page : ''));
    out = out.concat(d.items.map(p => ({ id: p.id, title: p.snippet.title, thumb: p.snippet.thumbnails?.medium?.url || p.snippet.thumbnails?.default?.url || '', count: p.contentDetails.itemCount })));
    page = d.nextPageToken || '';
  } while (page);
  pls = out; keep('pls', pls);
}
async function loadItems(pid, force) {
  const c = plItems[pid];
  if (!force && c && Date.now() - c.at < 10 * 60000) return;
  let out = [], page = '';
  do {
    const d = await api(`https://www.googleapis.com/youtube/v3/playlistItems?part=snippet,contentDetails&maxResults=50&playlistId=${pid}` + (page ? '&pageToken=' + page : ''));
    out = out.concat(d.items.filter(i => i.snippet.thumbnails && Object.keys(i.snippet.thumbnails).length).map(i => ({ pi: i.id, vid: i.contentDetails.videoId, title: i.snippet.title, ch: (i.snippet.videoOwnerChannelTitle || '').replace(/ - Topic$/, ''), thumb: i.snippet.thumbnails.medium?.url || i.snippet.thumbnails.default?.url || '' })));
    page = d.nextPageToken || '';
  } while (page);
  plItems[pid] = { at: Date.now(), items: out };
}
function showPl(pid) {
  go({ name: 'plv', id: pid, ps: view.ps });
  if (!plItems[pid]) render();
  loadItems(pid).then(() => { if (view.id === pid) render(); }).catch(e => e === 'auth' ? needAuth() : toast('불러오기 실패'));
}
async function loadStats() {
  // 구독자 수 + 쇼츠 포함 마지막 업로드(UU 재생목록), 하루 캐시
  const need = known().map(s => s.id).filter(id => !stats[id] || Date.now() - stats[id].at > 86400000);
  for (let i = 0; i < need.length; i += 50) {
    const part = need.slice(i, i + 50);
    const d = await api('https://www.googleapis.com/youtube/v3/channels?part=statistics&maxResults=50&id=' + part.join(','));
    const last = await Promise.all(part.map(id => api(`https://www.googleapis.com/youtube/v3/playlistItems?part=contentDetails&maxResults=1&playlistId=UU${id.slice(2)}`)
      .then(x => Date.parse(x.items?.[0]?.contentDetails?.videoPublishedAt) || 0).catch(e => { if (e === 'auth') throw e; return 0; })));
    part.forEach((id, k) => { const c = (d.items || []).find(x => x.id === id); stats[id] = { n: +(c?.statistics.subscriberCount || 0), last: last[k], at: Date.now() }; });
    keep('stats', stats); if (view.name === 'review') render();
  }
}
async function latestOf(id) {
  for (const p of ['UULF', 'UU']) {
    try {
      const d = await api(`https://www.googleapis.com/youtube/v3/playlistItems?part=snippet,contentDetails&maxResults=1&playlistId=${p}${id.slice(2)}`);
      const it = d.items?.[0];
      if (it) return { t: Date.parse(it.contentDetails.videoPublishedAt || it.snippet.publishedAt), title: it.snippet.title, vid: it.contentDetails.videoId, thumb: it.snippet.thumbnails?.medium?.url || '', at: Date.now() };
      if (p === 'UULF') continue;
    } catch (e) { if (e === 'auth') throw e; }
  }
  return { t: 0, at: Date.now() };
}
async function loadLatest(force) {
  const stale = known().filter(s => force || !latest[s.id] || Date.now() - latest[s.id].at > 15 * 60000);
  for (let i = 0; i < stale.length; i += 8) {
    const part = stale.slice(i, i + 8);
    const r = await Promise.all(part.map(s => latestOf(s.id)));
    part.forEach((s, k) => latest[s.id] = r[k]);
    keep('latest', latest);
    render();
  }
}

function applyImport() {
  const p = load('pending', null);
  if (!p) return false;
  p.forEach(({ g, c }) => {
    let grp = data.groups.find(x => x.name === g);
    if (!grp) data.groups.push(grp = { id: uid(), name: g, ch: [] });
    c.forEach(id => { if (!grp.ch.includes(id)) grp.ch.push(id); });
  });
  localStorage.removeItem(LS('pending'));
  return true;
}

function waitGis() { return new Promise(r => { const c = () => window.google?.accounts?.oauth2 ? r() : setTimeout(c, 100); c(); }); }
async function sync() {

    if (!data) data = { v: 1, groups: [], seen: {}, since: Date.now(), sort: { groups: 'manual', channels: 'recent' }, updated: 0 };

async function toggleSub(id) {

    if (s.off) {
      const r = await api('https://www.googleapis.com/youtube/v3/subscriptions?part=snippet', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ snippet: { resourceId: { kind: 'youtube#channel', channelId: id } } }) });
      subs.push({ id, sid: r.id, title: s.title, thumb: s.thumb }); dropped.delete(id);
    } else {
      await api('https://www.googleapis.com/youtube/v3/subscriptions?id=' + s.sid, { method: 'DELETE' });
      subs = subs.filter(x => x.id !== id); extra[id] = { id, title: s.title, thumb: s.thumb }; keep('extra', extra); dropped.add(id);
    }

  } catch (e) { e === 'auth' ? needAuth() : toast(e === 403 ? '오늘 한도를 다 썼습니다' : '실패했습니다'); }

}

function addDlg(url, pre) {
  const d = document.createElement('div'); d.className = 'dlg';
  const picked = new Set(pre ? [pre] : []);
  const draw = () => { const v = d.querySelector('input')?.value ?? url;
    d.innerHTML = `<div class="box"><b style="font-size:17px">재생목록에 넣기</b><input placeholder="곡·영상·앨범 주소" value="${esc(v)}" inputmode="url"><div class="chips">${pls.map(p => `<button class="chip ${picked.has(p.id) ? 'on' : ''}" data-pk="${p.id}">${esc(p.title)}</button>`).join('')}</div><div class="btns"><button class="btn s" data-x="c">취소</button><button class="btn p" data-x="ok" ${picked.size ? '' : 'disabled'}>넣기</button></div></div>`; };
  draw(); document.body.append(d);
  if (!url) d.querySelector('input').focus();
  d.onclick = e => {
    if (e.target === d) return d.remove();
    const k = e.target.closest('[data-pk]');
    if (k) { picked.has(k.dataset.pk) ? picked.delete(k.dataset.pk) : picked.add(k.dataset.pk); return draw(); }
    const x = e.target.closest('[data-x]')?.dataset.x;
    if (x === 'c') d.remove();
    if (x === 'ok') {
      const u = d.querySelector('input').value, v = vidOf(u), l = listOf(u);
      if (v) { d.remove(); return addTo(v, [...picked]); }            // 곡·영상 하나 (재생목록 안에서 공유한 곡도 곡 하나로)
      if (l) { d.remove(); return addList(l, [...picked]); }           // 앨범·재생목록 통째로
      toast(/browse\/MPRE/.test(u) ? '앨범의 공유 버튼으로 복사한 주소를 넣어 주세요' : '주소를 확인해 주세요');
    }
  };
}
async function addList(listId, ids) {
  let src = [], page = '';
  try {
    do {
      const d = await api(`https://www.googleapis.com/youtube/v3/playlistItems?part=contentDetails&maxResults=50&playlistId=${listId}` + (page ? '&pageToken=' + page : ''));
      src = src.concat(d.items.map(i => i.contentDetails.videoId)); page = d.nextPageToken || '';
    } while (page);
  } catch (e) { if (e === 'auth') return needAuth(); return toast('이 목록은 가져올 수 없습니다'); }
  let ok = 0, dup = 0;
  for (const id of ids) {
    try { await loadItems(id, true); } catch (e) { if (e === 'auth') return needAuth(); return toast('불러오기 실패'); }
    const have = new Set(plItems[id].items.map(x => x.vid));
    for (const v of src) {
      if (have.has(v)) { dup++; continue; }
      try {
        await api('https://www.googleapis.com/youtube/v3/playlistItems?part=snippet', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ snippet: { playlistId: id, resourceId: { kind: 'youtube#video', videoId: v } } }) });
        have.add(v); ok++; const p = pls.find(x => x.id === id); if (p) p.count++;
        if (ok % 5 === 0) toast(`넣는 중 ${ok}곡`);
      } catch (e) { if (e === 'auth') return needAuth(); keep('pls', pls); delete plItems[id]; render(); return toast(`${ok}곡 넣고 멈췄습니다${e === 403 ? ' (오늘 한도)' : ''}`); }
    }
    delete plItems[id];
  }
  keep('pls', pls); render();
  if (view.name === 'plv') loadItems(view.id).then(render).catch(() => {});
  toast(ok ? `${ok}곡 넣었습니다${dup ? ` · ${dup}곡은 이미 있음` : ''}` : '이미 모두 들어 있습니다');
}
async function addTo(v, ids) {
  let ok = 0, dup = 0;
  for (const id of ids) {
    try {
      const c = await api(`https://www.googleapis.com/youtube/v3/playlistItems?part=id&maxResults=1&playlistId=${id}&videoId=${v}`);
      if (c.items?.length) { dup++; continue; }
      await api('https://www.googleapis.com/youtube/v3/playlistItems?part=snippet', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ snippet: { playlistId: id, resourceId: { kind: 'youtube#video', videoId: v } } }) });
      const p = pls.find(x => x.id === id); if (p) p.count++; delete plItems[id]; ok++;
    } catch (e) { if (e === 'auth') return needAuth(); return toast(e === 404 ? '영상을 찾을 수 없습니다' : '넣기 실패'); }
  }
  keep('pls', pls); render();
  toast(ok ? `${ok}곳에 넣었습니다${dup ? ` · ${dup}곳은 이미 있음` : ''}` : '이미 들어 있습니다');
}

  <div class="main">${trackList(p.id)}<button class="add" data-act="pladd" style="border-style:solid">영상 넣기</button></div>`;
}
function plView() {
  const secs = plSections();
  return `<div class="head"><div class="row"><h1>재생목록</h1><button class="ib" data-act="plnewgroup" aria-label="새 그룹"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button></div><div class="meta">재생목록 ${pls.length}개</div>${tabs('pl')}</div>
  <div class="main">${secs.map(x => `${secs.length > 1 ? `<button class="sec" ${x.g ? `data-plg="${x.g.id}"` : ''}><h2>${esc(x.name)}</h2><span class="vs">${x.list.length}개</span></button>` : ''}${x.list.map(plRow).join('')}`).join('')}
    ${pls.length ? '' : '<div class="center"><span class="vs">재생목록이 없습니다</span></div>'}
    <button class="add" data-act="pladd" style="border-style:solid">영상 주소 붙여 넣어 재생목록에 넣기</button></div>`;
}
function home() {
  const fresh = freshList();
  const un = unsorted();
  const gs = sortGroups(data.groups);
  return `<div class="head"><div class="row"><h1>구독</h1><button class="ib" data-act="gsort" aria-label="정렬">${ic.sort}</button><button class="ib" data-act="menu" aria-label="메뉴">${ic.more}</button></div><div class="meta">그룹 ${data.groups.length}개 · 채널 ${subs.length}개</div>${tabs('sub')}</div>
  <div class="main">
    ${fresh.length ? `<div class="sec"><h2>새로 올라온 영상</h2><span class="badge">${fresh.length}</span></div><div class="strip">${fresh.slice(0, 20).map(vCard).join('')}</div>` : ''}
    ${un.length ? `<button class="notice" data-act="organize" style="width:calc(100% - 36px)">미분류 채널 ${un.length}개<b>정리하기 ›</b></button>` : ''}
    <div style="padding-top:6px">${gs.map(g => {
      const list = chOf(g); const n = newCount(list);
      return `<button class="item" data-g="${g.id}"><span class="gav">${esc(g.name.slice(0, 1))}</span><span class="body"><span class="name">${esc(g.name)}</span><span class="vs">채널 ${list.length}개</span></span>${n ? `<span class="badge">${n}</span>` : ''}</button>`;
    }).join('')}</div>
    <button class="add" data-act="newgroup">새 그룹</button>
    ${subs.length ? `<button class="add" data-act="organize" style="border-style:solid">채널 정리</button><button class="add" data-act="review" style="border-style:solid">구독 정리</button>` : ''}
  </div>`;
}
function groupView() {
  const g = data.groups.find(x => x.id === view.id);
  if (!g) { view = { name: 'home' }; return home(); }
  const list = sortChannels(chOf(g), g);
  const n = newCount(list);
  return `<div class="head"><div class="row"><button class="ib back" data-act="home" aria-label="뒤로">${ic.back}</button><span style="flex:1"></span>${n ? '<button class="pill" data-act="allseen">모두 확인</button>' : ''}<button class="ib" data-act="gmenu" aria-label="메뉴">${ic.more}</button></div>
    <div class="row"><h1>${esc(g.name)}</h1><button class="pill" data-act="csort">${label(chSorts, data.sort.channels)}</button></div><div class="meta">채널 ${list.length}개${n ? ' · 새 영상 ' + n + '개' : ''}</div></div>
  <div class="main">${list.length ? list.map(s => chRow(s)).join('') : '<div class="center"><span class="vs">채널이 없습니다</span></div>'}
    <button class="add" data-act="organize-g">채널 넣기 · 빼기</button></div>`;
}
function organize() {
  const gid = view.gid || null;
  const f = view.filter || (unsorted().length ? 'un' : 'all');
  view.filter = f;
  let list = f === 'un' ? unsorted() : gid && f === 'in' ? chOf(data.groups.find(x => x.id === gid)) : known();
  list = [...list].sort((a, b) => a.title.localeCompare(b.title, 'ko'));
  const segs = [['un', `미분류 ${unsorted().length}`], ['all', `전체 ${known().length}`]];
  if (gid) segs.splice(1, 0, ['in', '이 그룹']);
  const gs = sortGroups(data.groups);
  return `<div class="head"><div class="row"><button class="pill" data-act="${gid ? 'backg' : 'home'}" style="border:0;padding:0">취소</button><h1 style="font-size:18px;text-align:center">${sel.size}개 선택</h1><button class="pill" data-act="selall" style="border:0;padding:0">전체</button></div>
    <div class="seg" style="padding:6px 0 16px">${segs.map(s => `<button class="pill" data-f="${s[0]}" style="${s[0] === f ? 'background:var(--gold);color:var(--gold-ink);border-color:var(--gold);font-weight:700' : ''}">${s[1]}</button>`).join('')}</div></div>
  <div class="main" style="padding-bottom:0">${list.map(s => `<button class="item ${sel.has(s.id) ? 'on' : ''} ${s.off ? 'off' : ''}" data-sel="${s.id}"><span class="chk">${ic.chk}</span><span class="av" style="background-image:url('${esc(s.thumb)}')"></span><span class="body"><span class="name">${esc(s.title)}</span><span class="vs">${esc(data.groups.filter(g => g.ch.includes(s.id)).map(g => g.name).join(', ') || '미분류')}</span></span></button>`).join('') || '<div class="center"><span class="vs">정리할 채널이 없습니다</span></div>'}
  <div class="sheet"><b style="font-size:17px">넣을 그룹</b>
    <div class="chips">${gs.map(g => `<button class="chip ${pick.has(g.id) ? 'on' : ''}" data-pick="${g.id}">${esc(g.name)}</button>`).join('')}<button class="chip" data-act="newgroup-pick" style="border-style:dashed;color:var(--sub)">새 그룹</button></div>
    <div class="btns"><button class="btn p" data-act="put" ${sel.size && pick.size ? '' : 'disabled'}>넣기</button><button class="btn s" data-act="pull" ${sel.size && (pick.size || gid) ? '' : 'disabled'}>빼기</button></div></div></div>`;
}
const fmtN = n => '구독자 ' + new Intl.NumberFormat('ko', { notation: 'compact' }).format(n) + '명';
const lastUp = id => stats[id] ? stats[id].last : latest[id]?.t || 0; // 쇼츠 포함
const idle = id => (stats[id] || latest[id]?.at) && Date.now() - lastUp(id) > 365 * 86400000;
const isSub = id => subIds().has(id);
function review() {
  const f = view.filter || 'all';
  const all = known();
  let list = f === 'idle' ? all.filter(s => idle(s.id)) : f === 'off' ? all.filter(s => !isSub(s.id)) : all;
  list = [...list].sort((a, b) => lastUp(a.id) - lastUp(b.id));
  const segs = [['all', `전체 ${all.length}`], ['idle', `1년 넘게 쉼 ${all.filter(s => idle(s.id)).length}`], ['off', `구독 안 함 ${all.filter(s => !isSub(s.id)).length}`]];
  return `<div class="head"><div class="row"><button class="ib back" data-act="rvexit" aria-label="뒤로">${ic.back}</button><h1>구독 정리</h1></div>
    <div class="meta">구독 ${subs.length}개 · 오래 쉰 채널부터</div>
    <div class="seg" style="padding:0 0 16px">${segs.map(x => `<button class="pill" data-f="${x[0]}" style="${x[0] === f ? 'background:var(--gold);color:var(--gold-ink);border-color:var(--gold);font-weight:700' : ''}">${x[1]}</button>`).join('')}</div></div>
  <div class="main">${list.map(s => { const sub = isSub(s.id), b = busy.has(s.id); return `<div class="item ${sub ? '' : 'off'}" data-ch="${s.id}" style="cursor:pointer">
      <span class="av" style="background-image:url('${esc(s.thumb)}')"></span>
      <span class="body"><span class="name">${esc(s.title)}</span><span class="vs">${lastUp(s.id) ? ago(lastUp(s.id)) : stats[s.id] ? '영상 없음' : ''}${stats[s.id] ? ' · ' + fmtN(stats[s.id].n) : ''}</span></span>
      <button class="tg ${sub ? 'un' : 'keep'}" data-rs="${s.id}" ${b ? 'disabled style="opacity:.5"' : ''}>${b ? '…' : sub ? '구독 해제' : '구독'}</button></div>`; }).join('') || '<div class="center"><span class="vs">해당 채널이 없습니다</span></div>'}</div>`;
}
function reorder() {
  return `<div class="head"><div class="row"><h1 style="font-size:20px">그룹 순서</h1><button class="pill" data-act="home">완료</button></div><div class="meta"></div></div>
  <div class="main">${data.groups.map((g, i) => `<div class="item"><span class="gav">${esc(g.name.slice(0, 1))}</span><span class="body"><span class="name">${esc(g.name)}</span></span><span class="mv"><button data-up="${i}" aria-label="위로" ${i ? '' : 'disabled style="opacity:.25"'}>${ic.up}</button><button data-dn="${i}" aria-label="아래로" ${i < data.groups.length - 1 ? '' : 'disabled style="opacity:.25"'}>${ic.down}</button></span></div>`).join('')}</div>`;
}
const center = inner => `<div class="center"><img class="logo" src="../icons/icon-192.png" alt="">${inner}</div>`;

/* ---------- 태블릿 화면 ---------- */
function plWide() {
  const secs = plSections();
  if (!secs.find(x => x.key === view.ps)) view.ps = secs[0]?.key;
  const cur = secs.find(x => x.key === view.ps) || { list: [], name: '' };
  const sel = view.name === 'plv' ? pls.find(x => x.id === view.id) : null;
  if (sel) return `<div class="wide"><div class="rail">${railTabs('pl')}
      ${secs.map(x => `<button class="rg ${x.key === view.ps ? 'sel' : ''}" data-ps="${x.key}"><span>${esc(x.name)}</span><i style="font-weight:500">${x.list.length}</i></button>`).join('')}
      <button class="rg" data-act="plnewgroup" style="opacity:.8">+ 새 그룹</button></div>
    <div class="col"><div class="top"><h2>${esc(cur.name)}</h2><div class="vs" style="margin-top:4px">재생목록 ${cur.list.length}개</div></div>
      <div class="list">${cur.list.map(p => `<button class="item ${p.id === sel.id ? 'sel' : ''}" data-pl="${p.id}"><span class="pthumb" style="background-image:url('${esc(p.thumb)}')"></span><span class="body"><span class="name">${esc(p.title)}</span><span class="vs">영상 ${p.count}개</span></span></button>`).join('')}</div></div>
    <div class="feed"><div class="bar"><h2 style="margin:0;font-size:28px;flex:1">${esc(sel.title)}</h2>${plItems[sel.id]?.items.length ? '<button class="pill" data-act="plplay">전체 재생</button>' : ''}<button class="pill ${view.edit ? 'p' : ''}" data-act="pledit">${view.edit ? '완료' : '편집'}</button><button class="pill" data-act="plmenu">더보기</button><button class="pill p" data-act="pladd">영상 넣기</button></div>
      <div style="max-width:760px">${trackList(sel.id)}</div></div></div>`;
  return `<div class="wide"><div class="rail">${railTabs('pl')}
      ${secs.map(x => `<button class="rg ${x.key === view.ps ? 'sel' : ''}" data-ps="${x.key}"><span>${esc(x.name)}</span><i style="font-weight:500">${x.list.length}</i></button>`).join('')}
      <button class="rg" data-act="plnewgroup" style="opacity:.8">+ 새 그룹</button></div>
    <div class="feed"><div class="bar"><h2 style="margin:0;font-size:28px;flex:1">${esc(cur.name)}</h2>${cur.g ? `<button class="pill" data-plg="${cur.g.id}">그룹 편집</button>` : ''}<button class="pill p" data-act="pladd">영상 넣기</button></div>
      <div class="grid">${cur.list.map(p => `<button class="vcard" data-pl="${p.id}" style="text-align:left"><span class="thumb" style="background-image:url('${esc(p.thumb)}')"></span><span class="vt">${esc(p.title)}</span><span class="vs">영상 ${p.count}개</span></button>`).join('')}</div></div></div>`;
}
function wide() {
  if (view.name === 'pl' || view.name === 'plv') return plWide();
  const gs = sortGroups(data.groups);
  const un = unsorted();
  if (!view.wg) view.wg = gs[0]?.id || (un.length ? 'un' : null);
  const g = data.groups.find(x => x.id === view.wg);
  const list = view.wg === 'un' ? un : g ? sortChannels(chOf(g), g) : [];
  const vids = list.filter(s => latest[s.id]?.vid).sort((a, b) => latest[b.id].t - latest[a.id].t);
  const title = view.wg === 'un' ? '미분류' : g ? g.name : '';
  return `<div class="wide">
    <div class="rail">${railTabs('sub')}
      ${un.length ? `<button class="rg un ${view.wg === 'un' ? 'sel' : ''}" data-wg="un"><span>미분류</span><i>${un.length}</i></button>` : ''}
      ${gs.map(x => { const n = newCount(chOf(x)); return `<button class="rg ${x.id === view.wg ? 'sel' : ''}" data-wg="${x.id}"><span>${esc(x.name)}</span>${n ? `<i>${n}</i>` : ''}</button>`; }).join('')}
      <button class="rg" data-act="newgroup" style="opacity:.8">+ 새 그룹</button>
      <span style="flex:1"></span><button class="rg" data-act="review">구독 정리</button><button class="rg" data-act="theme">화면 테마</button>
    </div>
    <div class="col"><div class="top"><h2>${esc(title)}</h2><div class="vs" style="margin-top:4px">채널 ${list.length}개</div></div>
      <div class="list">${list.map(s => chRow(s)).join('')}</div></div>
    <div class="feed"><div class="bar">
      ${g ? `<button class="pill" data-act="csort">${label(chSorts, data.sort.channels)}</button><button class="pill" data-act="gmenu">그룹 편집</button>` : ''}
      <span style="flex:1"></span><button class="pill" data-act="gsort">${label(groupSorts, data.sort.groups)}</button>
      <button class="pill p" data-act="organize-w">정리 모드</button></div>
      <div class="grid">${vids.map(vCard).join('')}</div></div>
  </div>`;
}

/* ---------- 그리기 ---------- */
function render() {
  if (view.name === 'loading') { $app.innerHTML = center('<span class="vs">불러오는 중</span>'); return; }
  if (view.name === 'auth') { $app.innerHTML = center('<button class="btn p" data-act="login">계속</button>'); return; }
  if (!data) return;
  data.pl ||= { groups: [] };
  const narrow = { home, group: groupView, organize, reorder, review, pl: plView, plv: plvView }[view.name]?.() || home();
  const showWide = view.name === 'home' || view.name === 'group' || view.name === 'pl' || view.name === 'plv';
  $app.innerHTML = (showWide ? `<div class="narrow app">${narrow}</div>${wide()}` : `<div class="app ${view.name === 'review' ? 'rv' : ''}">${narrow}</div>`) + (authNeeded ? '<button class="relog" data-act="login">다시 연결</button>' : '');
}

/* ---------- 입력 ---------- */
let press = null, pressed = false;
const lpT = e => e.target.closest('[data-ch],[data-pl],[data-vid],[data-mv]');
const lpRun = t => t.dataset.mv ? itemMenu(t.dataset.pid, t.dataset.mv, t.dataset.pi) : t.dataset.ch ? chMenu(t.dataset.ch) : t.dataset.pl ? plMenu(t.dataset.pl) : addDlg('https://youtu.be/' + t.dataset.vid);
$app.addEventListener('pointerdown', e => { const t = lpT(e); pressed = false; if (!t) return; press = setTimeout(() => { pressed = true; lpRun(t); }, 500); });
['pointerup', 'pointercancel', 'pointermove'].forEach(k => $app.addEventListener(k, e => { if (k !== 'pointermove' || Math.abs(e.movementX) + Math.abs(e.movementY) > 4) clearTimeout(press); }));
$app.addEventListener('contextmenu', e => { const t = lpT(e); if (t) { e.preventDefault(); clearTimeout(press); if (!pressed) { pressed = true; lpRun(t); } } });
$app.addEventListener('click', e => {
  if (pressed) { pressed = false; return; }
  const t = e.target.closest('button,[data-ch]'); if (!t) return;
  const d = t.dataset;
  if (d.ch) return openChannel(d.ch);
  if (d.mv) return playTrack(d.pid, d.mv);
  if (d.tu || d.td) { const i = +(d.tu ?? d.td); return moveTrack(view.id, i, d.tu ? i - 1 : i + 1); }
  if (d.tx) { const it = plItems[view.id].items[+d.tx]; return choose(it.title, [['rm', '이 재생목록에서 빼기', 'danger']], '', () => removeTrack(view.id, it.pi)); }
  if (d.pl) return showPl(d.pl);
  if (d.plg) return plGroupMenu(d.plg);
  if (d.ps) { view.ps = d.ps; if (view.name === 'plv') view.name = 'pl'; return render(); }
  if (d.v) return openVideo(d.v, d.vid);
  if (d.g) return go({ name: 'group', id: d.g });
  if (d.wg) { view.wg = d.wg; view.id = d.wg; return render(); }
  if (d.rs) return toggleSub(d.rs);
  if (d.sel) { sel.has(d.sel) ? sel.delete(d.sel) : sel.add(d.sel); return render(); }
  if (d.pick) { pick.has(d.pick) ? pick.delete(d.pick) : pick.add(d.pick); return render(); }
  if (d.f) { view.filter = d.f; sel.clear(); return render(); }
  if (d.up || d.dn) { const i = +(d.up ?? d.dn), j = d.up ? i - 1 : i + 1; [data.groups[i], data.groups[j]] = [data.groups[j], data.groups[i]]; data.sort.groups = 'manual'; save(); return render(); }
  const cur = () => data.groups.find(x => x.id === (view.name === 'group' ? view.id : view.wg));
  switch (d.act) {
    case 'login': auth(load('acct', 0) ? '' : 'select_account').then(() => { authNeeded = false; keep('acct', 1); return sync(); }).catch(() => toast('로그인 실패')); break;
    case 'home': go({ name: 'home', wg: view.wg }); break;
    case 'backg': go({ name: 'group', id: view.gid }); break;
    case 'gsort': choose('그룹 정렬', groupSorts, data.sort.groups, v => { data.sort.groups = v; save(); render(); }); break;
    case 'csort': choose('채널 정렬', chSorts, data.sort.channels, v => { data.sort.channels = v; save(); render(); }); break;
    case 'reorder': go({ name: 'reorder' }); break;
    case 'tab-sub': go({ name: 'home' }); break;
    case 'menu': choose('메뉴', [['reorder', '그룹 순서'], ['review', '구독 정리'], ['theme', '화면 테마']], '', v => {
      if (v === 'reorder') go({ name: 'reorder' });
      if (v === 'review') { go({ name: "review" }); loadStats().catch(() => {}); }
      if (v === 'theme') themeDlg();
    }); break;
    case 'theme': themeDlg(); break;
    case 'tab-pl': go({ name: 'pl', ps: view.ps }); if (!pls.length) loadPls().then(render).catch(() => {}); break;
    case 'plback': go({ name: 'pl', ps: view.ps }); break;
    case 'pledit': view.edit = !view.edit; render(); break;
    case 'plplay': { const f = plItems[view.id]?.items[0]; if (f) playTrack(view.id, f.vid); break; }
    case 'plmenu': plMenu(view.id); break;
    case 'plnewgroup': ask('새 그룹', '', n => { data.pl.groups.push({ id: uid(), name: n, pl: [] }); save(); render(); }); break;
    case 'pladd': addDlg('', view.name === 'plv' ? view.id : null); break;
    case 'review': go({ name: "review" }); loadStats().catch(() => {}); break;
    case 'rvexit': { const gone = [...dropped].filter(id => !isSub(id)); if (gone.length) { data.groups.forEach(g => g.ch = g.ch.filter(c => !gone.includes(c))); save(); } dropped.clear(); go({ name: 'home' }); break; }
    case 'newgroup': case 'newgroup-pick': ask('새 그룹', '', v => { const g = { id: uid(), name: v, ch: [] }; data.groups.push(g); if (d.act === 'newgroup-pick') pick.add(g.id); save(); render(); }); break;
    case 'organize': go({ name: 'organize' }); break;
    case 'organize-w': go({ name: 'organize', gid: view.wg !== 'un' ? view.wg : null, filter: view.wg === 'un' ? 'un' : null }); break;
    case 'organize-g': go({ name: 'organize', gid: view.id, filter: 'in' }); break;
    case 'selall': { const all = [...$app.querySelectorAll('[data-sel]')].map(b => b.dataset.sel); const every = all.every(x => sel.has(x)); all.forEach(x => every ? sel.delete(x) : sel.add(x)); render(); break; }
    case 'put': data.groups.forEach(g => { if (pick.has(g.id)) sel.forEach(c => { if (!g.ch.includes(c)) g.ch.push(c); }); }); save(); toast(`${sel.size}개를 넣었습니다`); sel.clear(); render(); break;
    case 'pull': { const from = pick.size ? pick : new Set([view.gid]); data.groups.forEach(g => { if (from.has(g.id)) g.ch = g.ch.filter(c => !sel.has(c)); }); save(); toast(`${sel.size}개를 뺐습니다`); sel.clear(); render(); break; }
    case 'allseen': { const g = cur(); chOf(g).forEach(s => data.seen[s.id] = Date.now()); save(); render(); break; }
    case 'gmenu': { const g = cur(); if (!g) break; choose(g.name, [['rename', '이름 바꾸기'], ['seen', '모두 확인함'], ['del', '그룹 삭제', 'danger']], '', v => {
      if (v === 'rename') ask('그룹 이름', g.name, n => { g.name = n; save(); render(); });
      if (v === 'seen') { chOf(g).forEach(s => data.seen[s.id] = Date.now()); save(); render(); }
      if (v === 'del') { const i = data.groups.indexOf(g); const backup = g; data.groups.splice(i, 1); save(); go({ name: 'home' }); toast('그룹을 삭제했습니다'); undoDel = () => { data.groups.splice(i, 0, backup); save(); render(); }; }
    }); break; }
  }
});
let undoDel = null;

start();
}
</script>
</body>
</html>
