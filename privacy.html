<h1>개인정보처리방침</h1>
<h2>수집하는 정보</h2>
<p>로그인한 Google 계정의 YouTube 구독 목록과 재생목록을 읽어 화면에 표시합니다. 구독·구독 해제와 재생목록 편집은 사용자가 화면에서 직접 누른 경우에만 수행합니다.</p>
<h2>저장 위치</h2>
<p>그룹 구성과 설정은 사용자 본인의 Google 드라이브 앱 전용 공간에만 저장됩니다. 별도 서버에 저장하거나 제3자에게 제공하지 않습니다.</p>
<h2>권한 철회</h2>
<p>Google 계정 설정의 '서드 파티 앱 및 서비스'에서 언제든 접근 권한을 해제할 수 있습니다.</p>
